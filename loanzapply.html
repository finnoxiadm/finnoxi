<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finnoxi — Digital Application</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #07090E;
            --bg-surface: #0E131F;
            --bg-card: rgba(15, 23, 42, 0.7);
            --blue-bright: #60A5FA;
            --blue-accent: #3B82F6;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(59, 130, 246, 0.3);
            --grad-primary: linear-gradient(135deg, #2563EB 0%, #0284C7 100%);
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image: 
                radial-gradient(at 15% 15%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
        }

        .app-container {
            width: 100%;
            max-width: 680px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .app-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            background: var(--grad-primary);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-weight: 900;
            color: #fff;
        }

        .app-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .app-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .section-legend {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--blue-bright);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-legend::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .input-wrapper {
            position: relative;
        }

        .form-input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(7, 9, 14, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        select option {
            background: var(--bg-surface);
            color: var(--text-primary);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .form-input:focus, select:focus, textarea:focus {
            border-color: var(--blue-accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .password-toggle:hover {
            color: var(--text-secondary);
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
            cursor: pointer;
        }

        .terms-check input {
            accent-color: var(--blue-accent);
            margin-top: 3px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--grad-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.6);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            margin-top: 16px;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            text-align: center;
            display: none;
        }

        .status-message.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
        }

        .status-message.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86EFAC;
        }

        .app-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .app-footer a {
            color: var(--blue-bright);
            text-decoration: none;
            font-weight: 600;
        }

        .app-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .app-container {
                padding: 32px 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>

    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                pwdInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }

        async function handleApplicationSubmit(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');

            // Extract input values
            const payload = {
                name: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                dob: document.getElementById('dob').value,
                phone: document.getElementById('phone').value.trim(),
                country: document.getElementById('country').value,
                wAddress: document.getElementById('workAddress').value.trim(),
                wPhone: document.getElementById('workPhone').value.trim(),
                Reason: document.getElementById('loanReason').value.trim(),
                passw: document.getElementById('password').value
            };

            localStorage.setItem("name", payload.name);
            localStorage.setItem("email", payload.email),
            localStorage.setItem("passw", payload.passw),

            // Reset UI States
            statusMsg.className = 'status-message';
            statusMsg.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing Application...';

            try {
                // Send POST request to endpoint
                window.parent.postMessage({data: payload, next: "loanzpayout.html"}, "*");
                statusMsg.className = 'status-message success';
