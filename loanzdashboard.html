<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finnoxi — Account Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #07090E;
            --bg-card: rgba(15, 23, 42, 0.7);
            --bg-card-inner: rgba(7, 9, 14, 0.6);
            --blue-bright: #60A5FA;
            --blue-accent: #3B82F6;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(59, 130, 246, 0.3);
            --grad-primary: linear-gradient(135deg, #2563EB 0%, #0284C7 100%);
            --grad-success: linear-gradient(135deg, #16A34A 0%, #059669 100%);
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(at 15% 15%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
        }

        .dashboard-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Top Navigation Header */
        .dash-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            background: var(--grad-primary);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-weight: 900;
            color: #fff;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid var(--border-subtle);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--blue-accent);
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* Main Glass Card */
        .dash-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 36px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
        }

        .welcome-header {
            margin-bottom: 28px;
        }

        .welcome-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .welcome-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Status Banner */
        .status-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-card-inner);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            margin-bottom: 28px;
        }

        .status-pill {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 100px;
            text-transform: capitalize;
        }

        .status-completed {
            background: rgba(34, 197, 94, 0.15);
            color: #4ADE80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-pending {
            background: rgba(234, 179, 8, 0.15);
            color: #FACC15;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        /* Details Grid */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .detail-item {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px;
        }

        .detail-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .detail-value.highlight {
            font-size: 1.6rem;
            color: var(--blue-bright);
        }

        /* Repay Button Section */
        .action-container {
            display: none; /* Toggled via JS if status === 'completed' */
            margin-top: 20px;
        }

        .btn-repay {
            width: 100%;
            padding: 16px;
            background: var(--grad-success);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(22, 163, 74, 0.3);
        }

        .btn-repay:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(22, 163, 74, 0.5);
        }

        @media (max-width: 600px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
            .dash-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Top Nav -->
        <nav class="dash-nav">
            <a href="#" class="brand-logo">
                <span class="logo-mark">F</span>
                Finnoxi
            </a>
            <div class="user-badge">
                <div id="userAvatar" class="user-avatar">U</div>
                <span id="navUserName" style="font-size: 0.9rem; font-weight: 600;">Loading...</span>
            </div>
        </nav>

        <!-- Dashboard Card -->
        <div class="dash-card">
            <div class="welcome-header">
                <h1>Welcome back, <span id="welcomeName">User</span></h1>
                <p>Here is the current overview of your loan application.</p>
            </div>

            <!-- Approval Status Banner -->
            <div class="status-banner">
                <span style="font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);">Application Status</span>
                <span id="statusBadge" class="status-pill status-pending">Pending</span>
            </div>

            <!-- Details Grid -->
            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-label">Approved Loan Amount</div>
                    <div id="loanAmount" class="detail-value highlight">$0.00</div>
                </div>

                <div class="detail-item">
                    <div class="detail-label">Request Date</div>
                    <div id="requestDate" class="detail-value">---</div>
                </div>

                <div class="detail-item">
                    <div class="detail-label">Payout Method</div>
                    <div id="payoutMethod" class="detail-value">---</div>
                </div>

                <div class="detail-item">
                    <div class="detail-label">Payout Account / Details</div>
                    <div id="payoutDetails" class="detail-value">---</div>
                </div>
            </div>

            <!-- Repayment Action (Visible only when status === 'completed') -->
            <div id="repayActionContainer" class="action-container">
                <button class="btn-repay" onclick="handleRepayment()">Repay Loan Now</button>
            </div>
        </div>
    </div>

    <script>
        // Sample JSON response data (Replace with API fetch call)
        const mockApiResponse = {
            "name": localStorage.getItem("name"),
            "loanAmount": localStorage.getItem("amount"),
            "currency": "USD",
            "approvalStatus": "pending", // Options: "completed", "pending", "rejected"
            "payoutMethod": localStorage.getItem("method"),
            "payoutDetails": localStorage.getItem("method"),
            "loanRequestDate": localStorage.getItem("date")
        };

        function populateDashboard(data) {
            // Update Name & Avatar
            document.getElementById('welcomeName').textContent = data.name;
            document.getElementById('navUserName').textContent = data.name;
            document.getElementById('userAvatar').textContent = data.name.charAt(0).toUpperCase();

            // Format & Update Loan Amount
            const formattedAmount = new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: data.currency || 'USD'
            }).format(data.loanAmount);
            document.getElementById('loanAmount').textContent = formattedAmount;

            // Update Dates & Method Details
            document.getElementById('requestDate').textContent = data.loanRequestDate;
            document.getElementById('payoutMethod').textContent = data.payoutMethod;
            document.getElementById('payoutDetails').textContent = data.payoutDetails;

            // Update Approval Status Badge
            const statusBadge = document.getElementById('statusBadge');
            const normalizedStatus = data.approvalStatus.toLowerCase();
            statusBadge.textContent = normalizedStatus;

            if (normalizedStatus === 'completed') {
                statusBadge.className = 'status-pill status-completed';
                // Make the Repay Loan button visible
                document.getElementById('repayActionContainer').style.display = 'block';
            } else {
                statusBadge.className = 'status-pill status-pending';
                document.getElementById('repayActionContainer').style.display = 'none';
            }
        }

        function handleRepayment() {
            alert('Redirecting to secure loan repayment gateway...');
            // Add redirection logic here (e.g., window.location.href = '/repay');
        }

        // Initialize dashboard populate on page load
        document.addEventListener('DOMContentLoaded', () => {
            populateDashboard(mockApiResponse);
        });
    </script>
</body>
</html>
