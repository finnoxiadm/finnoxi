<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finnoxi — COMPLETE</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #07090E;
            --bg-card: rgba(15, 23, 42, 0.7);
            --blue-bright: #60A5FA;
            --blue-accent: #3B82F6;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-accent: rgba(59, 130, 246, 0.4);
            --grad-primary: linear-gradient(135deg, #2563EB 0%, #0284C7 100%);
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: 
                radial-gradient(at 20% 20%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
        }

        .otp-container {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 44px 36px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            background: var(--grad-primary);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-weight: 900;
            color: #fff;
        }

        .otp-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .otp-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* 4-Digit OTP Input Grid */
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .otp-field {
            width: 64px;
            height: 68px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            background: rgba(7, 9, 14, 0.6);
            color: var(--text-primary);
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
        }

        .otp-field:focus {
            border-color: var(--blue-accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            background: rgba(15, 23, 42, 0.9);
        }

        /* Resend Timer */
        .resend-section {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .btn-resend {
            background: none;
            border: none;
            color: var(--blue-bright);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        .btn-resend:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            text-decoration: none;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--grad-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.6);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            margin-top: 18px;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            display: none;
        }

        .status-message.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
        }

        .status-message.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86EFAC;
        }
    </style>
</head>
<body>

    <div class="otp-container">
        <a href="#" class="brand-logo">
            <span class="logo-mark">F</span>
            Finnoxi
        </a>

        <div class="otp-header">
            <h1>Loan Request Accepted</h1>
            <p>Your loan request has been queued for validation, approval and disbursment.</p>
        </div>

        <form id="otpForm" onsubmit="handleOtpSubmit(event)">

            <button type="submit" id="submitBtn" class="btn-submit">Login Account</button>
            <div id="statusMsg" class="status-message"></div>

        </form>
    </div>

    <script>
        const inputs = Array.from(document.querySelectorAll('.otp-field'));
        let countdown = 60;
        let timerInterval;

        // Auto Focus Next/Prev on Typing
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });


        async function handleOtpSubmit(event) {

            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');

            statusMsg.className = 'status-message';
            statusMsg.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Redirecting ...';

            let dat = {next: "loanzdashboard.html"};
            window.parent.postMessage(dat, "*");
        }

        // Initialize Timer
        startTimer();
    </script>
</body>
</html>
